---
# The keepalived VIP, not any single master's IP. This feeds
# kubeadm --control-plane-endpoint and Cilium's k8sServiceHost, so pointing it
# at a real node silently pins the whole cluster to that node: every
# kubelet.conf, kube-proxy kubeconfig and Cilium agent then talks to it
# directly and the VIP does nothing. Losing that one master takes every node
# NotReady despite the other two apiservers being healthy. 10.4.0.5 is in the
# apiserver certSANs, so it is valid to address directly.
control_plane_endpoint: "10.4.0.5:6443"
pod_network_cidr: "10.42.0.0/16"
cilium_version: "1.16.5"

# Floating VIP for the control plane, failover-only via keepalived (no
# load-balancing across masters -- matches the same failover-only model
# used for MetalLB). Outside VLAN 30's DHCP range (.6-.199) and outside
# the MetalLB pool (.200-.220).
control_plane_vip: "10.4.0.5"
control_plane_vip_interface: "eth0"
control_plane_vip_router_id: 51
# VRRP auth is a legacy/weak mechanism (deprecated in the RFC, kept only
# for interop) -- not a real secret, just here to stop stray VRRP traffic
# on the same VLAN from a different project interfering.
control_plane_vip_auth_pass: "k8shomelab-vrrp"

# PERSONALIZE: gates the control_plane_oidc role (see its tasks/main.yml).
# Defaults to true so this deployment's own re-runs of the playbook keep
# working unchanged -- if you're standing up your own cluster, set this to
# `false` in your own inventory/group_vars override until you've set up your
# own OIDC provider and replaced the two values below, otherwise a plain
# `ansible-playbook playbook.yml` run will point your kube-apiserver at an
# issuer you don't control (which can crash-loop it if unreachable).
oidc_enabled: true

# PERSONALIZE: this deployment's own Authentik application. These used to be
# hardcoded inside control_plane_oidc; they were lifted out here on
# 2026-08-16 when that role was rewritten to drive the kubeadm-config
# ClusterConfiguration instead of editing the static pod manifest, so that
# forking the repo no longer means editing role internals.
#
# Neither value is a secret: the issuer URL is public, and an OIDC client_id
# is an identifier rather than a credential (the apiserver only *validates*
# tokens here, it never authenticates as this client).
oidc_issuer_url: "https://auth.jacobbanghart.com/application/o/headlamp/"
oidc_client_id: "BPpp9hCaFCjhfY9C8xOU5AvVYWcRCkjXVU3VeZIH"

# PERSONALIZE: gates the split_horizon_dns role, whose defaults/main.yml
# lists this deployment's own public hostnames and Traefik VIP. Defaults to
# true for this deployment's own re-runs; set it to `false` in your own
# inventory override until you've replaced that hostname list with yours,
# otherwise CoreDNS will answer for names you don't serve at an address you
# don't own. Only affects resolution inside the cluster -- public DNS
# records (published by external-dns at the WAN address) are untouched.
split_horizon_dns_enabled: true
