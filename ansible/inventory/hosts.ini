[masters]
k8s-master-0 ansible_host=10.4.0.10 keepalived_state=MASTER keepalived_priority=150
k8s-master-1 ansible_host=10.4.0.11 keepalived_state=BACKUP keepalived_priority=140
k8s-master-2 ansible_host=10.4.0.12 keepalived_state=BACKUP keepalived_priority=130

[workers]
k8s-worker-0 ansible_host=10.4.0.20
k8s-worker-1 ansible_host=10.4.0.21
k8s-worker-2 ansible_host=10.4.0.22

[k8s_cluster:children]
masters
workers

# control_plane_init is only the host that runs `kubeadm init` and the
# cluster-wide installs (CNI, metrics-server) on a from-scratch build. Any
# master can hold the role. It is master-2 rather than master-0 because
# master-0 has been rebuilt and rejoined like any other node -- there is no
# lasting "first master".
[control_plane_init]
k8s-master-2

[control_plane_join]
k8s-master-0
k8s-master-1
