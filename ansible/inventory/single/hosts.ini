# Single-node cluster (control plane + workloads on one VM). Used with
# playbook-single.yml:  ansible-playbook -i inventory/single/hosts.ini playbook-single.yml
# See docs/single-node-migration.md. The node is in `masters` so the
# control_plane_* / split_horizon_dns roles apply to it unchanged.
[masters]
k8s-homelab-0 ansible_host=10.4.0.30

[workers]

[k8s_cluster:children]
masters
workers

[control_plane_init]
k8s-homelab-0

[control_plane_join]
