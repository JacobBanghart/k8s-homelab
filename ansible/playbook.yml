---
- name: Common OS config across the whole cluster
  hosts: k8s_cluster
  become: true
  tags: [common]
  roles:
    - common

- name: Containerd drift correction across the whole cluster
  hosts: k8s_cluster
  become: true
  tags: [containerd]
  roles:
    - containerd

- name: Initialize the first control-plane node
  hosts: control_plane_init
  become: true
  tags: [kubeadm-init]
  roles:
    - kubeadm_init

- name: Install CNI
  hosts: control_plane_init
  become: true
  tags: [cni]
  roles:
    - cni

- name: Join remaining control-plane nodes
  hosts: control_plane_join
  become: true
  tags: [join-masters]
  roles:
    - join_masters

- name: Join worker nodes
  hosts: workers
  become: true
  tags: [join-workers]
  roles:
    - join_workers

- name: Install metrics-server
  hosts: control_plane_init
  become: true
  tags: [metrics-server]
  roles:
    - metrics_server

- name: Install floating VIP for the control plane
  hosts: masters
  become: true
  tags: [control-plane-vip]
  roles:
    - control_plane_vip

- name: Expose control-plane component metrics for Prometheus
  hosts: masters
  become: true
  # One master at a time -- this restarts etcd's static pod when patched,
  # and restarting all 3 etcd members simultaneously would break quorum.
  serial: 1
  tags: [control-plane-metrics]
  roles:
    - control_plane_metrics

- name: Trust Authentik as an OIDC issuer on kube-apiserver
  hosts: masters
  become: true
  # One master at a time -- a bad --oidc-issuer-url crash-loops that
  # master's apiserver, and the role's own wait-for-Ready check catches
  # that before moving on to the next one.
  serial: 1
  tags: [control-plane-oidc]
  roles:
    # Gated by oidc_enabled (group_vars/all.yml, defaults true for this
    # deployment). The issuer URL and client_id live alongside it as
    # oidc_issuer_url / oidc_client_id -- they used to be hardcoded inside
    # the role, and were lifted out on 2026-08-16 so forks no longer have
    # to edit role internals. New forks should set oidc_enabled: false
    # until they've replaced those two values with their own provider's.
    - { role: control_plane_oidc, when: oidc_enabled }

- name: Split-horizon DNS for this cluster's own public hostnames
  hosts: masters
  become: true
  # One master at a time -- this role restarts kube-apiserver to redo its
  # cached OIDC discovery, and its wait-for-Ready check catches a master
  # that does not come back before the next one is touched.
  serial: 1
  tags: [split-horizon-dns]
  roles:
    # Must run after control-plane-oidc: that role sets the apiserver's
    # --oidc-issuer-url, and this one makes that URL actually resolvable
    # from inside the cluster and from the masters themselves.
    # Gated by split_horizon_dns_enabled (group_vars/all.yml) since the
    # hostnames in defaults/main.yml are this deployment's own.
    - { role: split_horizon_dns, when: split_horizon_dns_enabled }

- name: Security-only automatic OS patching across the whole cluster
  hosts: k8s_cluster
  become: true
  tags: [unattended-upgrades]
  roles:
    - unattended_upgrades
