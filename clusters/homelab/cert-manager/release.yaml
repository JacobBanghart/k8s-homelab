apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 10m
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.0"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # cert-manager's chart templates its CRDs behind this value rather than
    # Helm's native crds/ directory mechanism, so this (not
    # spec.install.crds, which controls the native mechanism) is what
    # actually installs them.
    crds:
      enabled: true
    # Check DNS-01 propagation against public resolvers, not cluster DNS.
    #
    # From the k8s-lab VLAN, an NS lookup for jacobbanghart.com through
    # CoreDNS comes back empty (the same query from the primary LAN via
    # Pi-hole answers fine), so cert-manager could never find Cloudflare's
    # authoritative servers and every challenge sat at "DNS record not yet
    # propagated" indefinitely -- the TXT records themselves were live.
    # Found 2026-09-27 with 9 challenges stuck for ~29h since the cutover.
    extraArgs:
      - --dns01-recursive-nameservers-only
      - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53
    resources:
      requests:
        cpu: "10m"
        memory: "32Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
    webhook:
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
    cainjector:
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
