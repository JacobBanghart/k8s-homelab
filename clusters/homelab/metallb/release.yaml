apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 10m
  chart:
    spec:
      chart: metallb
      version: "0.16.1"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: metallb-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  # Both the controller and the speaker DaemonSet shipped with no resource
  # requests, which made them BestEffort: the first QoS class the kubelet
  # evicts under node memory pressure, and the highest oom_score_adj for the
  # kernel OOM killer.
  #
  # That is the wrong eviction order for what MetalLB does. The speaker is
  # what answers ARP for every LoadBalancer VIP on this cluster --
  # 10.4.0.200 (Traefik, which carries all WAN traffic), .201 (Mosquitto),
  # .202 (Minecraft) and .203 (the Ceph dashboard). Evicting it on a node
  # under memory pressure withdraws those VIPs from that node exactly when
  # the cluster is already struggling.
  #
  # The speaker pod has four containers and a pod is only better than
  # BestEffort if EVERY container has requests, so all four are sized here.
  # Requests come from observed usage (speaker ~29-55Mi, frr ~21Mi,
  # frr-metrics ~10-14Mi, reloader ~1Mi); the point is to buy a QoS class,
  # not to reserve capacity.
  values:
    controller:
      resources:
        requests:
          cpu: "25m"
          memory: "96Mi"
        limits:
          memory: "256Mi"
    speaker:
      resources:
        requests:
          cpu: "25m"
          memory: "96Mi"
        limits:
          memory: "256Mi"
    # L2 only, no BGP peers: run the native BGP backend so neither FRR
    # mode (deprecated in 0.16) nor the frr-k8s subchart gets deployed.
    frrk8s:
      enabled: false
