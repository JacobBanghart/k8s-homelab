---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ceph-backup-script
  namespace: rook-ceph
data:
  backup.sh: |
    #!/bin/bash
    set -u

    POOL="${CEPH_POOL:-replicapool}"
    # PVCs whose contents rebuild themselves -- metrics TSDBs, log stores and
    # build caches. They are also among the largest volumes, so skipping them
    # is most of the savings.
    EXCLUDE_REGEX="${EXCLUDE_REGEX:-}"

    CEPH_CONFIG=/etc/ceph/ceph.conf
    KEYRING_FILE=/etc/ceph/keyring
    MON_CONFIG=/etc/rook/mon-endpoints

    # --- Replicate the rook toolbox's ceph client bootstrap -----------------
    endpoints=$(cat "${MON_CONFIG}")
    mon_endpoints=$(echo "${endpoints}" | sed 's/[a-z0-9_-]\+=//g')

    cat <<EOF > "${KEYRING_FILE}"
    [${ROOK_CEPH_USERNAME}]
    key = ${ROOK_CEPH_SECRET}
    EOF

    cat <<EOF > "${CEPH_CONFIG}"
    [global]
    mon_host = ${mon_endpoints}

    [client.admin]
    keyring = ${KEYRING_FILE}
    EOF

    echo "mon endpoints: ${mon_endpoints}"
    mkdir -p "${RESTIC_CACHE_DIR:-/tmp/restic-cache}"

    RESTIC=/shared/restic
    "${RESTIC}" snapshots >/dev/null 2>&1 || {
      echo "restic repository unreachable -- check credentials"; exit 1
    }

    TS=$(date +%Y%m%d-%H%M%S)
    OK=0; FAIL=0; SKIP=0

    # Publish the PVC->image mapping alongside the data. Without it the
    # csi-vol-* names in the repo are unidentifiable at restore time.
    if [ -f /scripts/pvc-map.txt ]; then
      "${RESTIC}" backup --stdin --stdin-filename "pvc-map.txt" \
        --tag ceph-rbd --tag metadata --host k8s-homelab < /scripts/pvc-map.txt \
        && echo "OK: pvc-map.txt"
    fi

    for IMG in $(rbd ls "${POOL}"); do
      if [ -n "${EXCLUDE_REGEX}" ] && echo "${IMG}" | grep -qE "${EXCLUDE_REGEX}"; then
        echo "SKIP: ${IMG}"; SKIP=$((SKIP+1)); continue
      fi

      LABEL="${IMG}"
      if [ -f /scripts/pvc-map.txt ]; then
        M=$(awk -v i="${IMG}" '$1==i {print $2}' /scripts/pvc-map.txt | head -1)
        [ -n "${M}" ] && LABEL="${M}"
      fi

      SNAP="restic-backup-${TS}"
      echo "=== ${LABEL} (${IMG})"

      if ! rbd snap create "${POOL}/${IMG}@${SNAP}" 2>&1; then
        echo "SNAP FAILED: ${LABEL}"; FAIL=$((FAIL+1)); continue
      fi

      # No --from-snap, so this emits every allocated extent and nothing else.
      if rbd export-diff "${POOL}/${IMG}@${SNAP}" - 2>/dev/null \
         | "${RESTIC}" backup --stdin --stdin-filename "${LABEL}.rbddiff" \
             --tag ceph-rbd --tag "${LABEL}" --host k8s-homelab; then
        echo "OK: ${LABEL}"; OK=$((OK+1))
      else
        echo "BACKUP FAILED: ${LABEL}"; FAIL=$((FAIL+1))
      fi

      rbd snap rm "${POOL}/${IMG}@${SNAP}" >/dev/null 2>&1 \
        || echo "WARNING: leaked snapshot ${POOL}/${IMG}@${SNAP}"
    done

    echo "=== COMPLETE ok=${OK} fail=${FAIL} skip=${SKIP}"
    [ "${FAIL}" -eq 0 ]
  # Regenerate after adding or removing PVCs:
  #   kubectl get pv -o json | jq -r '.items[]|select(.spec.csi.driver|test("rbd"))|
  #     "\(.spec.csi.volumeAttributes.imageName) \(.spec.claimRef.namespace)_\(.spec.claimRef.name)"'
  pvc-map.txt: |
