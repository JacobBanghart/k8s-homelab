---
# SMTP credentials for Alertmanager's email receiver.
#
# This deliberately reads the *invoice-ninja* Vault path rather than a
# monitoring-owned one. The credential is a single Cloudflare Email Routing
# API token for smtp.mx.cloudflare.net, already provisioned and known-working
# for invoice-ninja; writing a second copy to a monitoring/ path requires an
# interactive `vault login -method=oidc` (browser), which would have blocked
# getting alerting switched on at all.
#
# Worth tidying next time Vault is being edited anyway: move the token to
# something like `shared/smtp` and repoint both ExternalSecrets at it. Until
# then the coupling is real -- rotating the invoice-ninja mail token silently
# breaks alert delivery, which is exactly the kind of failure that hides
# because the thing that would tell you about it is the thing that broke.
#
# Only MAIL_PASSWORD is consumed here. Alertmanager reads it from disk via
# smtp_auth_password_file rather than having it inlined into the generated
# config secret; alertmanagerSpec.secrets mounts it at
# /etc/alertmanager/secrets/alertmanager-smtp/.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-smtp
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: alertmanager-smtp
    creationPolicy: Owner
  data:
    - secretKey: MAIL_PASSWORD
      remoteRef:
        key: invoice-ninja/invoice-ninja-mail-secret
        property: MAIL_PASSWORD
